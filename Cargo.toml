[package]
name = "ctgui"
version = "0.1.0"
edition = "2024"
description = "A GUI to discover and run ctest tests for CMake projects and ROS 2 colcon workspaces"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
